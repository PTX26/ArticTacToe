<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLP Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <h1>SLP Word List Dashboard</h1>

  <input id="dw-sound" placeholder="Sound (e.g., S)">
  <input id="dw-pos" placeholder="Position (start/middle/end)">
  <input id="dw-word" placeholder="Word">
  <input id="dw-image" type="file">
  <button id="dw-add">Add Word</button>

  <div id="dw-list"></div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
